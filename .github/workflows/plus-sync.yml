# Keeps the fork up to date with upstream: once a week (or when run by hand
# from the Actions tab) it does what GitHub's "Sync fork" button does for
# main, then merges upstream's main into the plus branch, checks that it
# still builds, and pushes it. A conflict it can't resolve opens an issue
# instead and changes nothing.
#
# Scheduled runs only happen from the repository's default branch, so plus
# must be the default branch.
#
# Optional: with the repository secrets PLUS_KEYSTORE_BASE64 (the release
# keystore, base64-encoded) and PLUS_KEYSTORE_PASSWORD it also builds the
# signed APK and drafts a GitHub release. Without them, build the release APK
# with release/build-release.sh from the private ysosrsss/test repo.
name: Sync upstream into Pocket Wormhole+

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Bump the version and build even if upstream has nothing new"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: plus-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plus
          fetch-depth: 0

      - name: Sync main with upstream (the "Sync fork" button)
        run: |
          git fetch -q https://github.com/adamkulik/pocket-wormhole main
          # Fast-forward only: main is a plain copy of upstream's main.
          git push origin FETCH_HEAD:refs/heads/main || echo "::warning::main couldn't be fast-forwarded to upstream (does it have its own commits?)"

      - name: Merge upstream into plus
        id: sync
        env:
          FORCE: ${{ inputs.force_build || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/plus_sync.py

      - name: Report a conflict
        if: steps.sync.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          echo "### Upstream changes conflict with plus" >> "$GITHUB_STEP_SUMMARY"
          echo "Conflicting files: \`$CONFLICTS\`. Nothing was changed; merge upstream's main into plus by hand, then run this again." >> "$GITHUB_STEP_SUMMARY"
          # Issues may be turned off for the repository: then the failed run
          # (and its summary) is the report.
          title="Upstream changes conflict with Pocket Wormhole+"
          if gh issue list --limit 1 >/dev/null 2>&1 && [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "The weekly sync couldn't merge upstream's main into \`plus\`: these files conflict:

          \`$CONFLICTS\`

          Nothing was changed. Merge it by hand (or ask Claude with the context in ysosrsss/test's ftl-sim/CONTEXT.md), then run the workflow again."
          fi
          exit 1

      - uses: actions/setup-java@v4
        if: steps.sync.outputs.status == 'updated'
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        id: build
        if: steps.sync.outputs.status == 'updated'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
        run: |
          # gradle.properties points at the upstream author's Windows JDK.
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            # No signing key: just check the merged code builds.
            ./gradlew --no-daemon :app:assembleDebug
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plus.keystore"
          ./gradlew --no-daemon :app:assembleRelease \
            -Ppocketwormhole.storeFile="$RUNNER_TEMP/plus.keystore" \
            -Ppocketwormhole.storePassword="$KEYSTORE_PASSWORD" \
            -Ppocketwormhole.keyAlias=pocketwormholeplus \
            -Ppocketwormhole.keyPassword="$KEYSTORE_PASSWORD"
          rm "$RUNNER_TEMP/plus.keystore"
          cp app/build/outputs/apk/release/app-release.apk "PocketWormholePlus-${{ steps.sync.outputs.version }}.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Push plus
        if: steps.sync.outputs.status == 'updated'
        run: |
          git push origin HEAD:plus
          echo "plus is now Pocket Wormhole+ ${{ steps.sync.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Draft the release
        if: steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.sync.outputs.tag }}" \
            "PocketWormholePlus-${{ steps.sync.outputs.version }}.apk" \
            --target plus --draft \
            --title "Pocket Wormhole+ ${{ steps.sync.outputs.version }}" \
            --notes-file plus-release-notes.md
